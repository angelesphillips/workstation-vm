---
# Detect new SSH connections at the authentication layer (PAM) instead of from
# ~/.bash_profile, which only ran for login shells and could be bypassed. A
# pam_exec hook fires on every SSH session open and notifies through two
# layers: a `wall` broadcast (reaches SSH-only sessions with no GUI) and a
# spool file watched by a `systemd --user` unit that pops a zenity window when
# a GNOME session is live.

- name: Look up the target user's UID
  ansible.builtin.command: id -u {{ the_user }}
  register: target_user_id
  changed_when: false

- name: Set the user UID fact
  ansible.builtin.set_fact:
    user_uid: "{{ target_user_id['stdout'] | trim }}"

- name: Install the shared personal-SSH-key removal script
  ansible.builtin.template:
    src: templates/remove-personal-ssh-keys.sh.j2
    dest: /usr/local/sbin/remove-personal-ssh-keys.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the PAM-invoked SSH connection notifier
  ansible.builtin.template:
    src: templates/ssh-connection-notify.sh.j2
    dest: /usr/local/sbin/ssh-connection-notify.sh
    owner: root
    group: root
    mode: "0755"

# Graphical logout key removal.
#
# gdm's logout hooks (pam_exec on gdm-password/gdm-autologin, and the
# PostSession script) all run in the confined SELinux domain xdm_t, which is
# not permitted to unlink files in ~/.ssh (ssh_home_t) -- the rm fails with
# "Permission denied" even as root. Instead, bind a `systemd --user` oneshot to
# graphical-session.target: on logout the target stops and ExecStop runs the
# removal in the user's unconfined domain, with no SELinux policy change.

- name: Remove obsolete gdm pam_exec key-removal lines (superseded by user unit)
  ansible.builtin.lineinfile:
    path: "/etc/pam.d/{{ item }}"
    regexp: "remove-personal-ssh-keys-on-close"
    state: absent
  loop:
    - gdm-password
    - gdm-autologin

- name: Remove the obsolete PAM close-session wrapper
  ansible.builtin.file:
    path: /usr/local/sbin/remove-personal-ssh-keys-on-close.sh
    state: absent

- name: Create the user systemd directory
  ansible.builtin.file:
    path: ~{{ the_user }}/.config/systemd/user
    state: directory
    owner: "{{ the_user }}"
    group: "{{ the_user }}"
    mode: "0755"

- name: Install the graphical-logout user service
  ansible.builtin.template:
    src: templates/ssh-key-logout-cleanup.service.j2
    dest: ~{{ the_user }}/.config/systemd/user/ssh-key-logout-cleanup.service
    owner: "{{ the_user }}"
    group: "{{ the_user }}"
    mode: "0644"
  register: logout_cleanup_unit

- name: Enable the graphical-logout user service
  become: true
  become_user: "{{ the_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ user_uid }}"
  ansible.builtin.systemd:
    name: ssh-key-logout-cleanup.service
    scope: user
    enabled: true
    state: started
    daemon_reload: "{{ logout_cleanup_unit is changed }}"

- name: Install the screen-lock key-removal watcher
  ansible.builtin.template:
    src: templates/ssh-key-lock-watch.sh.j2
    dest: /usr/local/bin/ssh-key-lock-watch.sh
    owner: root
    group: root
    mode: "0755"

- name: Install the screen-lock user service
  ansible.builtin.template:
    src: templates/ssh-key-lock-cleanup.service.j2
    dest: ~{{ the_user }}/.config/systemd/user/ssh-key-lock-cleanup.service
    owner: "{{ the_user }}"
    group: "{{ the_user }}"
    mode: "0644"
  register: lock_cleanup_unit

- name: Enable the screen-lock user service
  become: true
  become_user: "{{ the_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ user_uid }}"
  ansible.builtin.systemd:
    name: ssh-key-lock-cleanup.service
    scope: user
    enabled: true
    state: started
    daemon_reload: "{{ lock_cleanup_unit is changed }}"

- name: Install the shutdown/reboot SSH key cleanup service
  ansible.builtin.template:
    src: templates/ssh-key-cleanup.service.j2
    dest: /etc/systemd/system/ssh-key-cleanup.service
    owner: root
    group: root
    mode: "0644"
  register: key_cleanup_service

- name: Enable the shutdown/reboot SSH key cleanup service
  ansible.builtin.systemd:
    name: ssh-key-cleanup.service
    enabled: true
    state: started
    daemon_reload: "{{ key_cleanup_service is changed }}"

- name: Install the desktop zenity dispatcher
  ansible.builtin.template:
    src: templates/ssh-connection-zenity.sh.j2
    dest: /usr/local/bin/ssh-connection-zenity.sh
    owner: root
    group: root
    mode: "0755"

- name: Create the spool directory tmpfiles configuration
  ansible.builtin.template:
    src: templates/ssh-connection-notify.tmpfiles.j2
    dest: /etc/tmpfiles.d/ssh-connection-notify.conf
    owner: root
    group: root
    mode: "0644"

- name: Create the spool directory now (do not wait for a reboot)
  ansible.builtin.command: systemd-tmpfiles --create /etc/tmpfiles.d/ssh-connection-notify.conf
  changed_when: false

- name: Allow the user to terminate sessions without a password (for the dialog)
  ansible.builtin.template:
    src: templates/ssh-connection-notify.sudoers.j2
    dest: /etc/sudoers.d/ssh-connection-notify
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"

- name: Hook the notifier into the sshd PAM session phase
  # Fail-open script in the session phase: a notifier failure can never block
  # an SSH login. Placed in /etc/pam.d/sshd so it applies only to SSH.
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sshd
    line: "session    optional     pam_exec.so /usr/local/sbin/ssh-connection-notify.sh"
    insertafter: EOF
    state: present
    validate: "/bin/true %s"

- name: Install the user .service unit
  ansible.builtin.template:
    src: templates/ssh-connection-notify.service.j2
    dest: ~{{ the_user }}/.config/systemd/user/ssh-connection-notify.service
    owner: "{{ the_user }}"
    group: "{{ the_user }}"
    mode: "0644"
  register: notify_service_unit

- name: Install the user .path unit
  ansible.builtin.template:
    src: templates/ssh-connection-notify.path.j2
    dest: ~{{ the_user }}/.config/systemd/user/ssh-connection-notify.path
    owner: "{{ the_user }}"
    group: "{{ the_user }}"
    mode: "0644"
  register: notify_path_unit

- name: Enable lingering so the user path unit runs without an active login
  ansible.builtin.command: loginctl enable-linger {{ the_user }}
  args:
    creates: /var/lib/systemd/linger/{{ the_user }}

- name: Reload the user systemd manager
  become: true
  become_user: "{{ the_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ user_uid }}"
  ansible.builtin.systemd:
    scope: user
    daemon_reload: true
  when: notify_service_unit is changed or notify_path_unit is changed

- name: Enable and start the SSH connection watcher path unit
  become: true
  become_user: "{{ the_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ user_uid }}"
  ansible.builtin.systemd:
    name: ssh-connection-notify.path
    scope: user
    enabled: true
    state: started
