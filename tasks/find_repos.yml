---
- name: Find personal or Red Hat Git repositories
  become: true
  become_user: "{{ the_user }}"
  ansible.builtin.find:
    paths:
      - /home/{{ the_user }}
      - /home/{{ the_user }}/Curriculum
    file_type: directory
    recurse: false
    use_regex: true
    patterns:
      - '^rht\.dynolabs_aap$'
      - '^rht\.dynolabs_common$'
      - '^dle\.components$'
      - '^workstation-vm$'
      - '^flamel$'
      - '^AU.*$'
      - '^DO.*$'
  register: query_personal_and_rh_repos

- name: Set found_repos
  when:
    - query_personal_and_rh_repos['matched'] is defined
    - query_personal_and_rh_repos['matched'] > 0
  ansible.builtin.set_fact:
    found_repos: >-
      {{ query_personal_and_rh_repos['files'] | map(attribute='path') }}
